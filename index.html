<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090807">
  <title>Arcana Lab</title>
  <style>
    *{box-sizing:border-box}
    html,body,main{width:100%;height:100%;margin:0}
    body{min-width:320px;background:#090807}
    main{position:relative;display:grid;place-items:center;overflow:hidden}
    .background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
    .box{position:relative;width:min(320px,70vw);image-rendering:pixelated}
    .docs{position:absolute;bottom:24px;left:clamp(20px,4vw,56px);width:88px;height:88px}
    .docs img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
    .docs:focus-visible{outline:2px solid white;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <img class="background" src="art.gif" alt="">
    <img class="box" src="mid-box.png" alt="">
    <a class="docs" href="docs.html" aria-label="Docs"><img src="docs-logo.png" alt=""></a>
  </main>
</body>
</html>
